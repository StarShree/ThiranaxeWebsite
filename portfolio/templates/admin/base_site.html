{% extends "admin/base.html" %}
{% load static %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | ShriramPortfolio Admin{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Custom Cyber Dark Admin Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/admin_theme.css' %}">
{% endblock %}

{% block branding %}
<div id="site-name" class="admin-branding-box">
    <a href="{% url 'admin:index' %}" class="admin-brand-link">
        <span class="brand-bracket">&lt;</span><span class="brand-name">ShriramPortfolio</span><span class="brand-bracket"> /&gt;</span>
        <span class="brand-badge"><i class="fa-solid fa-sliders"></i> Admin Portal</span>
    </a>
</div>
{% endblock %}
